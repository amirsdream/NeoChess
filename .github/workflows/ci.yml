name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows
            setup_target: windows
            fetch_target: Windows
            engine: stockfish.exe
          - os: ubuntu-latest
            label: Linux
            setup_target: linux
            fetch_target: Linux
            engine: stockfish
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-godot
        with:
          target: ${{ matrix.setup_target }}

      - name: Cache Stockfish
        uses: actions/cache@v4
        with:
          path: |
            bin/${{ matrix.engine }}
            bin/Copying.txt
            bin/AUTHORS
            bin/STOCKFISH.txt
          key: stockfish-${{ matrix.setup_target }}-${{ hashFiles('dev/fetch_stockfish.ps1') }}

      - name: Fetch Stockfish for the engine tests
        shell: pwsh
        run: ./dev/fetch_stockfish.ps1 -Target ${{ matrix.fetch_target }}

      - name: Run tests
        shell: pwsh
        run: ./tests/run_tests.ps1

  build:
    name: Build ${{ matrix.label }} package
    runs-on: ${{ matrix.os }}
    needs: test
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows
            setup_target: windows
            build_target: Windows
            artifact: NeoChess-windows
            engine: stockfish.exe
            binary: NeoChess.exe
          - os: ubuntu-latest
            label: Linux
            setup_target: linux
            build_target: Linux
            artifact: NeoChess-linux
            engine: stockfish
            binary: NeoChess.x86_64
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-godot
        with:
          target: ${{ matrix.setup_target }}

      - name: Install zip
        if: matrix.setup_target == 'linux'
        run: sudo apt-get update && sudo apt-get install -y zip

      - name: Cache Stockfish
        uses: actions/cache@v4
        with:
          path: |
            bin/${{ matrix.engine }}
            bin/Copying.txt
            bin/AUTHORS
            bin/STOCKFISH.txt
          key: stockfish-${{ matrix.setup_target }}-${{ hashFiles('dev/fetch_stockfish.ps1') }}

      - name: Build
        shell: pwsh
        run: ./dev/build.ps1 -Target ${{ matrix.build_target }} -Version 0.0.0

      - name: Check the package
        shell: pwsh
        run: |
          foreach ($name in "${{ matrix.binary }}", "${{ matrix.engine }}", "Copying.txt", "AUTHORS", "STOCKFISH.txt") {
            $file = Join-Path "dist/NeoChess" $name
            if (-not (Test-Path $file)) { throw "Missing $name in the package." }
            "{0}  {1:N1} MB" -f $name, ((Get-Item $file).Length / 1MB)
          }
          $engine = Join-Path "dist/NeoChess" "${{ matrix.engine }}"
          $out = & $engine compiler
          if (-not ($out -join " ").Contains("Stockfish")) { throw "Bundled Stockfish does not run." }

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/NeoChess
          retention-days: 7
